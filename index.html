<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segundas voces</title><style>:root{--ds-page:#fcfbfa;--ds-ink:#1d1b18;--ds-ink-2:#6b665c;--ds-hairline:#e2ddd2}
*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:var(--ds-ink);font:16px/1.5 system-ui,sans-serif}
.card{max-width:760px;margin:0 auto;background:var(--ds-page);padding:24px 20px 48px;min-height:100vh}
h1{font-size:38px;margin:8px 0}h2{font-size:22px;margin:32px 0 8px}.fact{color:var(--ds-ink-2)}
.choice{margin:14px 0}.lbl{color:var(--ds-ink-2);font-size:14px;margin-bottom:6px}.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.btn{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--ds-hairline);background:#fff;color:var(--ds-ink);cursor:pointer}
.opt.sel{background:#6fa89d;color:#fff;border-color:#6fa89d}.btn.primary{background:#1f6f6a;color:#fff;border-color:#1f6f6a}
.callout{border-radius:12px;background:#efe9dc;padding:12px 14px;margin:12px 0}.callout.danger{background:#fbe3de}
footer{margin-top:32px;color:var(--ds-ink-2);font-size:14px}
html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.file-nav { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--ds-hairline); }
.file-nav a { padding: 10px 0; color: var(--ds-ink-2); text-decoration: none; }
.file-nav a[aria-current="page"] { color: var(--ds-ink); box-shadow: inset 0 -1px 0 var(--ds-ink); }
@media (max-width: 600px) { .file-nav a { display: inline-flex; align-items: center; min-height: 44px; } }
.chips, .btnrow, .pairs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip { display: flex; flex-direction: column; align-items: center; min-width: 44px; min-height: 52px; padding: 6px 10px; border: 1px solid var(--ds-hairline); border-radius: 12px; background: #fff; color: var(--ds-ink); font: inherit; font-weight: 600; cursor: pointer; }
.chip span { font-size: 11px; font-weight: 400; color: var(--ds-ink-2); }
.pairs .pair { display: flex; flex-direction: column; align-items: center; min-width: 40px; padding: 6px 8px; border-radius: 10px; background: #fff; border: 1px solid var(--ds-hairline); }
.pair small { font-size: 11px; color: var(--ds-ink-2); }
.pair.pass { border-color: #1f9d55; } .pair.fail { border-color: #d4452f; }
.stage { width: 100%; border-radius: 16px; overflow: hidden; margin: 12px 0; border: 1px solid var(--ds-hairline); line-height: 0; }
.stage canvas { display: block; }
.finger { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ds-ink-2); }
.finger input { width: 100%; height: 44px; }
.hud { display: flex; align-items: center; gap: 12px; margin: 10px 0; min-height: 48px; }
.hud .sub { font-size: 13px; color: var(--ds-ink-2); }
.light { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #b9b3a4; }
.light.ok { background: #1f9d55; } .light.bad { background: #d4452f; }
.grade { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grade span { font-size: 56px; font-weight: 700; line-height: 1; }
.grade small { color: var(--ds-ink-2); }
